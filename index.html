<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شرکت ترانسپورتی بین المللی نوروزی</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f5f7fa;
    color:#222;
    line-height:1.9;
    font-family:Tahoma,Arial,sans-serif;
    transition:background .35s,color .35s;
}

/* ================= SETTINGS BUTTON ================= */

.settings-wrapper{
    position:fixed;
    top:15px;
    right:15px;
    z-index:9999;
}

.settings-button{
    width:40px;
    height:40px;
    border:none;
    border-radius:10px;
    background:#f5b72f;
    color:#071b35;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
    transition:.3s;
}

.settings-button:hover{
    transform:scale(1.06);
    background:#ffd568;
}

.settings-menu{
    position:absolute;
    top:50px;
    right:0;
    width:270px;
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.22);
    opacity:0;
    visibility:hidden;
    transform:translateY(-10px);
    transition:.3s;
}

.settings-menu.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.settings-title{
    font-family:"B Titr",Tahoma,sans-serif;
    color:#071b35;
    font-size:19px;
    margin-bottom:15px;
    border-bottom:2px solid #f5b72f;
    padding-bottom:8px;
}

.setting-item{
    margin-bottom:15px;
}

.setting-label{
    display:block;
    font-family:"B Titr",Tahoma,sans-serif;
    color:#333;
    margin-bottom:7px;
}

.setting-button-option{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    background:#f5f7fa;
    border-radius:8px;
    cursor:pointer;
    font-family:Tahoma,Arial,sans-serif;
    text-align:right;
    transition:.25s;
}

.
