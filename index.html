<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شرکت ترانسپورتی بین المللی نوروزی</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f5f7fa;
    color:#222;
    line-height:1.9;
    font-family:Tahoma,Arial,sans-serif;
    transition:background .35s,color .35s;
}

/* ================= SETTINGS BUTTON ================= */

.settings-wrapper{
    position:fixed;
    top:15px;
    right:15px;
    z-index:9999;
}

.settings-button{
    width:40px;
    height:40px;
    border:none;
    border-radius:10px;
    background:#f5b72f;
    color:#071b35;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
    transition:.3s;
}

.settings-button:hover{
    transform:scale(1.06);
    background:#ffd568;
}

.settings-menu{
    position:absolute;
    top:50px;
    right:0;
    width:270px;
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.22);
    opacity:0;
    visibility:hidden;
    transform:translateY(-10px);
    transition:.3s;
}

.settings-menu.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.settings-title{
    font-family:"B Titr",Tahoma,sans-serif;
    color:#071b35;
    font-size:19px;
    margin-bottom:15px;
    border-bottom:2px solid #f5b72f;
    padding-bottom:8px;
}

.setting-item{
    margin-bottom:15px;
}

.setting-label{
    display:block;
    font-family:"B Titr",Tahoma,sans-serif;
    color:#333;
    margin-bottom:7px;
}

.setting-button-option{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    background:#f5f7fa;
    border-radius:8px;
    cursor:pointer;
    font-family:Tahoma,Arial,sans-serif;
    text-align:right;
    transition:.25s;
}

.setting-button-option:hover{
    border-color:#f5b72f;
    background:#fff8df;
}

.language-select{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-family:"Segoe UI Emoji","Noto Color Emoji",Tahoma,Arial,sans-serif;
    background:#f5f7fa;
    cursor:pointer;
}

/* ================= DARK MODE ================= */

body.dark-mode{
    background:#101722;
    color:#eee;
}

body.dark-mode .settings-menu{
    background:#182231;
    color:white;
}

body.dark-mode .settings-title,
body.dark-mode .setting-label{
    color:white;
}

body.dark-mode .setting-button-option,
body.dark-mode .language-select{
    background:#101722;
    color:white;
    border-color:#344052;
}

body.dark-mode .about,
body.dark-mode .request,
body.dark-mode .service,
body.dark-mode .truck-card,
body.dark-mode .contact-box,
body.dark-mode .map-box{
    background:#182231;
    color:#eee;
}

body.dark-mode .gallery,
body.dark-mode .contact{
    background:#121b28;
}

body.dark-mode .section-title h2,
body.dark-mode .service h3,
body.dark-mode .truck-info h3,
body.dark-mode .contact-box h3,
body.dark-mode .map-box h3{
    color:#f5b72f;
}

body.dark-mode .request-container{
    background:#121b28;
}

body.dark-mode .request-intro{
    color:#bbb;
}

body.dark-mode .form-group label{
    color:#f5b72f;
}

body.dark-mode .form-group input,
body.dark-mode .form-group select,
body.dark-mode .form-group textarea{
    background:#101722;
    color:white;
    border-color:#344052;
}

body.dark-mode .phone-item{
    background:#101722;
}

body.dark-mode .phone-number{
    color:#f5b72f;
}

body.dark-mode .address-text{
    color:#ddd;
}

/* ================= HEADER ================= */

header{
    background:#071b35;
    color:white;
    padding:18px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.25);

    /* فضای دکمه تنظیمات */
    padding-right:70px;
}

.logo{
    font-family:"B Titr",Tahoma,sans-serif;
    font-size:26px;
    font-weight:bold;
    color:#f5b72f;
}

nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
}

nav a{
    position:relative;
    color:white;
    text-decoration:none;
    margin:0 10px;
    padding:5px 2px 8px;
    font-family:"B Titr",Tahoma,sans-serif;
    transition:color .3s;
}

/* خط زیر گزینه منو */

nav a::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    width:0;
    height:2px;
    margin:auto;
    background:#f5b72f;
    border-radius:5px;
    transition:width .3s ease;
}

nav a:hover{
    color:#f5b72f;
}

nav a:hover::after{
    width:100%;
}

/* ================= SECTIONS SCROLL ================= */

section{
    padding:80px 7%;
    scroll-margin-top:90px;
}

/* ================= HERO ================= */

.hero{
    min-height:650px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 20px;

    background:
    linear-gradient(
        rgba(4,18,38,.72),
        rgba(4,18,38,.84)
    ),
    url("https://dispatch42.school/images/articles/1748615690428/articleImageMobile.jpeg");

    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:1000px;
    color:white;
}

.hero h1{
    font-family:"B Titr",Tahoma,sans-serif;
    font-size:50px;
    color:#f5b72f;
    margin-bottom:15px;
}

.hero h2{
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:34px;
    font-weight:600;
    margin-bottom:20px;
}

.hero p{
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:25px;
    margin-bottom:35px;
}

/* ================= BUTTONS ================= */

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:12px 30px;
    border-radius:8px;
    text-decoration:none;
    font-family:"B Titr",Tahoma,sans-serif;
    font-weight:bold;
    transition:.3s;
}

.btn-primary{
    background:#f5b72f;
    color:#071b35;
}

.btn-primary:hover{
    background:#ffd568;
    transform:translateY(-3px);
}

.btn-whatsapp{
    background:#20c76a;
    color:white;
}

.btn-whatsapp:hover{
    background:#16a958;
    transform:translateY(-3px);
}

.btn-telegram{
    background:#229ED9;
    color:white;
}

.btn-telegram:hover{
    background:#168ac0;
    transform:translateY(-3px);
}

.btn-instagram{
    background:#d62976;
    color:white;
}

.btn-instagram:hover{
    background:#b81f62;
    transform:translateY(-3px);
}

/* ================= GENERAL ================= */

.section-title{
    text-align:center;
    margin-bottom:50px;
}

.section-title h2{
    color:#071b35;
    font-family:"B Titr",Tahoma,sans-serif;
    font-size:36px;
    margin-bottom:10px;
}

.section-title span{
    display:block;
    width:80px;
    height:4px;
    background:#f5b72f;
    margin:auto;
    border-radius:10px;
}

/* ================= ABOUT ================= */

.about{
    background:white;
}

.about-content{
    max-width:1000px;
    margin:auto;
    text-align:center;
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:23px;
}

/* ================= SERVICES ================= */

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.service{
    background:white;
    padding:35px 25px;
    text-align:center;
    border-radius:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.service:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 30px rgba(0,0,0,.14);
}

.service-icon{
    font-size:50px;
    margin-bottom:15px;
}

.service h3{
    color:#071b35;
    font-family:"B Titr",Tahoma,sans-serif;
    font-size:23px;
    margin-bottom:10px;
}

.service p{
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:19px;
}

/* ================= GALLERY ================= */

.gallery{
    background:#eef2f6;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.truck-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
    transition:.3s;
}

.truck-card:hover{
    transform:translateY(-8px);
}

.truck-card img{
    width:100%;
    height:270px;
    object-fit:cover;
    display:block;
}

.truck-info{
    padding:20px;
    text-align:center;
}

.truck-info h3{
    font-family:"B Titr",Tahoma,sans-serif;
    color:#071b35;
    font-size:22px;
}

.truck-info p{
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:18px;
}

/* ================= REQUEST ================= */

.request{
    background:white;
}

.request-container{
    max-width:950px;
    margin:auto;
    background:#f5f7fa;
    padding:40px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.request-intro{
    text-align:center;
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:20px;
    margin-bottom:30px;
    color:#555;
}

.request-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-group label{
    font-family:"B Titr",Tahoma,sans-serif;
    color:#071b35;
    font-size:17px;
    margin-bottom:8px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px 15px;
    border:1px solid #d8dde5;
    border-radius:9px;
    background:white;
    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#f5b72f;
    box-shadow:0 0 0 3px rgba(245,183,47,.15);
}

.form-group textarea{
    min-height:150px;
    resize:vertical;
}

.submit-request{
    grid-column:1 / -1;
    border:0;
    background:#20c76a;
    color:white;
    padding:15px;
    border-radius:9px;
    font-family:"B Titr",Tahoma,sans-serif;
    font-size:19px;
    cursor:pointer;
    transition:.3s;
}

.submit-request:hover{
    background:#16a958;
    transform:translateY(-2px);
}

/* ================= NUMBERS ================= */

.numbers{
    background:#071b35;
    color:white;
}

.numbers-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    text-align:center;
}

.number h3{
    color:#f5b72f;
    font-family:Arial,sans-serif;
    font-size:42px;
}

.number p{
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:19px;
}

/* ================= CONTACT ================= */

.contact{
    background:#eef2f6;
}

.contact-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.contact-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.contact-box h3{
    color:#071b35;
    font-family:"B Titr",Tahoma,sans-serif;
    font-size:25px;
    margin-bottom:20px;
    border-bottom:2px solid #f5b72f;
    padding-bottom:10px;
}

.phone-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.phone-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#f5f7fa;
    padding:12px 15px;
    border-radius:9px;
}

.phone-number{
    color:#071b35;
    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:19px;
    direction:ltr;
}

.phone-number:hover{
    color:#d49b14;
}

.phone-label{
    font-family:"Noto Nastaliq Urdu",serif;
    color:#555;
}

.address-text{
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:20px;
    line-height:2.2;
}

.address-line{
    margin-bottom:10px;
}

.map-box{
    grid-column:1 / -1;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.map-box h3{
    color:#071b35;
    font-family:"B Titr",Tahoma,sans-serif;
    font-size:25px;
    margin-bottom:18px;
}

.map-preview{
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.map-preview iframe{
    width:100%;
    height:330px;
    border:0;
    display:block;
}

.map-actions{
    display:flex;
    justify-content:center;
    margin-top:18px;
}

.map-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 25px;
    background:#0b6efd;
    color:white;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.map-link:hover{
    background:#0956d1;
    transform:translateY(-2px);
}

/* ================= FOOTER ================= */

footer{
    background:#041225;
    color:white;
    text-align:center;
    padding:30px 20px;
}

footer strong{
    color:#f5b72f;
    font-family:"B Titr",Tahoma,sans-serif;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    header{
        flex-direction:column;
        gap:12px;
    }

    nav{
        text-align:center;
    }

    nav a{
        display:inline-block;
        margin:5px;
        font-size:14px;
    }

    .hero{
        min-height:580px;
    }

    .hero h1{
        font-size:35px;
    }

    .hero h2{
        font-size:27px;
    }

    .hero p{
        font-size:20px;
    }

    .services-grid,
    .gallery-grid{
        grid-template-columns:1fr;
    }

    .numbers-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .request-form{
        grid-template-columns:1fr;
    }

    .form-group.full,
    .submit-request{
        grid-column:auto;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

    .map-box{
        grid-column:auto;
    }

    .section-title h2{
        font-size:30px;
    }

    .request-container{
        padding:25px 18px;
    }

    .phone-item{
        flex-direction:column;
        align-items:flex-start;
    }

}

@media(max-width:500px){

    .settings-wrapper{
        top:12px;
        right:12px;
    }

    .settings-button{
        width:38px;
        height:38px;
        font-size:21px;
        border-radius:9px;
    }

    .settings-menu{
        width:245px;
        top:48px;
    }

    header{
        padding-right:62px;
    }

    section{
        padding:60px 5%;
    }

    .numbers-grid{
        grid-template-columns:1fr 1fr;
    }

    .number h3{
        font-size:32px;
    }

    .hero h1{
        font-size:29px;
    }

    .hero h2{
        font-size:23px;
    }

    .hero p{
        font-size:18px;
    }

    .map-preview iframe{
        height:280px;
    }

    nav a{
        padding-bottom:7px;
    }

}

/* ================= LTR SUPPORT ================= */

html[dir="ltr"] .settings-menu{
    right:0;
    left:auto;
}

html[dir="ltr"] .setting-button-option{
    text-align:left;
}

html[dir="ltr"] nav{
    direction:ltr;
}

</style>

</head>
